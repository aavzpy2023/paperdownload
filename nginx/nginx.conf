server {
    listen 81;
    server_name _;
    client_max_body_size 50m;

    # Docker's resolver + variables: nginx keeps working if the backend container restarts.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8000;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location = /_vnc_auth {
        internal;
        set $auth_url http://backend:8000/api/vnc/auth;
        proxy_pass $auth_url;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # Each person's noVNC runs on its own port; the backend says which one after checking the login cookie.
    location /vnc/ {
        auth_request /_vnc_auth;
        auth_request_set $vnc_port $upstream_http_x_vnc_port;
        rewrite ^/vnc/(.*)$ /$1 break;
        proxy_pass http://backend:$vnc_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # index.html names the hashed bundle, so it must always be revalidated or a stale copy keeps an old UI.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
