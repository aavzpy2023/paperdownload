# nginx is the only published port (81). The backend and each session's noVNC stay on the
# private compose network; nginx exposes noVNC at /vnc/ only after the backend authorizes
# the login cookie. State lives in named volumes, so nothing depends on the host user or OS.
services:
  backend:
    container_name: paperdownloader-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    platform: linux/amd64  # Google Chrome has no Linux arm64 build: Apple Silicon runs it emulated
    shm_size: 2gb
    restart: unless-stopped
    environment:
      - PD_MAX_SESSIONS=${PD_MAX_SESSIONS:-6}
      - PD_ADMIN_USER
      - PD_ADMIN_PASSWORD
    volumes:
      - pd_data:/app/data
      - pd_downloads:/app/downloads

  nginx:
    container_name: paperdownloader-nginx
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      # Reachable from other computers on your network; PD_BIND=127.0.0.1 in .env restricts it to this computer.
      - "${PD_BIND:-0.0.0.0}:81:81"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pd_data:
  pd_downloads:
