[project]
name = "paper-downloader"
version = "0.1.0"
description = "Download articles from EBSCO Research for every entry in a .bib file"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "python-xlib>=0.33",
    "playwright>=1.45",
    "bibtexparser>=1.4,<2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["paper_downloader"]

[tool.pytest.ini_options]
pythonpath = ["."]
